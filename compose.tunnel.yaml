# Optional public HTTPS access:
# docker compose -f compose.yaml -f compose.tunnel.yaml up --build -d
services:
  app:
    # Only the tunnel can reach the app, so its forwarded client IP and protocol are trustworthy.
    ports: !reset []
    environment:
      COOKIE_SECURE: 'true'
      TRUST_PROXY: 'uniquelocal'

  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    command: tunnel --no-autoupdate --protocol auto --url http://app:3000
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
