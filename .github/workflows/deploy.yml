name: Deploy

# Runs after CI publishes an image from main, or manually (for example to roll back to an older tag).
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (sha-xxxxxxx or latest). Use an older sha to roll back.
        required: true
        default: latest

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production
    # Skipped until the server exists: set the repository variable DEPLOY_HOST (docs/deployment.md).
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      # The server's authorized_keys forces deploy.sh for this key; the tag is its only argument.
      - name: Deploy ${{ inputs.tag }}
        env:
          TAG: ${{ inputs.tag }}
          TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
        run: ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes "$TARGET" "$TAG"
      - name: Check readiness
        if: vars.DEPLOY_URL != ''
        env:
          URL: ${{ vars.DEPLOY_URL }}
        run: curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$URL/api/ready"
