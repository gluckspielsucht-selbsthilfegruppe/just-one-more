name: Dependabot auto-merge

on: pull_request

permissions: {}

jobs:
  auto-merge:
    name: Enable auto-merge
    # Both checks: a human pushing to a Dependabot branch must not enable auto-merge.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # GitHub merges once the required checks on main pass; failing PRs stay open.
      - run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
