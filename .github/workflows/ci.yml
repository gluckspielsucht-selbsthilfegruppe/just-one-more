name: CI

on:
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  schedule:
    # Weekly full-browser run catches drift in browsers and transitive dependencies.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are cancelled; main runs finish so a deploy is never cut off.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pull requests run e2e in Chromium only; main, the weekly run, and manual runs cover all browsers.
  FULL_E2E: ${{ github.event_name != 'pull_request' }}

jobs:
  verify:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  e2e:
    name: End-to-end (Playwright)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Select browsers
        id: browsers
        run: |
          echo "playwright=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          if [ "$FULL_E2E" = "true" ]; then
            echo "install=chromium firefox webkit" >> "$GITHUB_OUTPUT"
            echo "projects=" >> "$GITHUB_OUTPUT"
          else
            echo "install=chromium" >> "$GITHUB_OUTPUT"
            echo "projects=--project=chromium --project=mobile-chrome" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache@v5
        id: cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.browsers.outputs.playwright }}-${{ steps.browsers.outputs.install }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ steps.browsers.outputs.install }}
      - if: steps.cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ steps.browsers.outputs.install }}
      - run: npx playwright test ${{ steps.browsers.outputs.projects }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Docker image smoke test
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: just-one-more:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the container and check health
        run: |
          docker run -d --name app -p 3000:3000 just-one-more:ci
          for _ in $(seq 1 30); do curl -fsS http://localhost:3000/api/ready && break; sleep 1; done
          curl -fsS http://localhost:3000/api/ready
          curl -fsS http://localhost:3000/ | grep -q '<div id="root">'
      - if: always()
        run: docker logs app

  publish:
    name: Publish image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [e2e, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: publish
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.publish.outputs.tag }}
    secrets: inherit
