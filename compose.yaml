# For internet multiplayer, also load compose.tunnel.yaml (see README.md).
services:
  app:
    build: .
    init: true
    ports:
      - '${PORT:-3000}:3000'
    environment:
      COOKIE_SECURE: '${COOKIE_SECURE:-false}'
    volumes:
      - game-data:/app/data
    restart: unless-stopped

volumes:
  game-data:
