# For internet multiplayer, also load compose.tunnel.yaml (see README.md).
services:
  app:
    build: .
    init: true
    ports:
      - '${PORT:-3000}:3000'
    environment:
      # Empty values: Secure cookies follow the request protocol; proxy headers are not trusted.
      COOKIE_SECURE: '${COOKIE_SECURE:-}'
      TRUST_PROXY: '${TRUST_PROXY:-}'
    volumes:
      - game-data:/app/data
    restart: unless-stopped

volumes:
  game-data:
